<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="data(g)market">
<title>data(g)market</title>
<desc>Original Data Guild vector crest with a Polymarket-inspired frame. Wordmark converted to paths.</desc>
<ns0:defs xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink">

		<ns0:symbol id="bracket" viewBox="0 0 8 56">
			<ns0:path d="      M 0 0      H 8      V 1      H 2      V 55      H 8      V 56      H 0      Z     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;     " />
		</ns0:symbol>

		<ns0:clipPath id="gear_tooth_clip">
			<ns0:rect x="0" y="0" width="7" height="8" />
		</ns0:clipPath>

		<ns0:symbol id="gear_tooth" viewBox="0 0 7 8">
			<ns0:path d="      M 0 2      A 1 1, 0, 0 1, 1 1      L 8 0      V 8      L 1 7      A 1 1, 0, 0 1, 0 6      Z     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;      clip-path: url(#gear_tooth_clip);     " />
		</ns0:symbol>

		<ns0:clipPath id="gear_clip">
			<ns0:rect x="0" y="0" width="14" height="56" />
		</ns0:clipPath>

		<ns0:symbol id="gear" viewBox="0 0 14 56">
			<ns0:path d="      M 32 0      A 28 28, 0, 0 0, 32 56      V 53      A 25 25, 0, 0 1, 32 3      Z      M 32 4      A 24 24, 0, 0 0, 32 52      V 51      A 23 23, 0, 0 1, 32 5      Z     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;      clip-path: url(#gear_clip);     " />
			<ns0:use ns1:href="#gear_tooth" width="7" height="8" transform="rotate(32.5, 32 28) translate(0 24)" />
			<ns0:use ns1:href="#gear_tooth" width="7" height="8" transform="translate(0 24)" />
			<ns0:use ns1:href="#gear_tooth" width="7" height="8" transform="rotate(-32.5, 32 28) translate(0 24)" />
		</ns0:symbol>

		<ns0:symbol id="letter_d" viewBox="0 0 16 18">
			<ns0:path d="      M 0 0      H 8      Q 16 0, 16 9      T 8 18      H 0      V 17      H 2      V 1      H 0      Z      M 5 1      V 17      H 8      Q 13 17, 13 9      T 8 1      Z     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;     " />
		</ns0:symbol>

		<ns0:symbol id="letter_g" viewBox="0 0 16 18">
			<ns0:path d="      M 8 0      Q 15 0, 15 6      H 13      Q 13 1, 8 1      Q 3 1, 3 9      T 8 17      Q 12 17, 12 13      V 12      H 9      V 11      H 16      V 12      H 15      V 13      Q 15 18, 8 18      Q 0 18, 0 9      T 8 0     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;     " />
			<ns0:path d="      M 13 2      L 15 0      V 6      H 13      Z      M 15 13      V 18      L 12 15      V 13      Z     " style="      fill: currentColor;      stroke: currentColor;      stroke-width: 0;     " />
		</ns0:symbol>

	</ns0:defs>


<defs><mask id="crest-clearance"><rect width="1500" height="500" fill="white"/><rect x="131" y="179" width="175.2" height="155" fill="black"/></mask></defs>
<g fill="none" stroke="white" stroke-width="12" stroke-linejoin="miter">
<path d="M 100 185 L 330 118 L 330 390 L 100 323 Z"/>
<path d="M 100 185 L 330 254 L 100 323" stroke-linejoin="bevel" mask="url(#crest-clearance)"/>
</g>
<ns0:g xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" color="#fff" transform="translate(145 192) scale(2.3)">

		<ns0:use ns1:href="#bracket" width="8" height="56" transform="translate(15 0)" />
		<ns0:use ns1:href="#bracket" width="8" height="56" transform="translate(49 0) scale(-1 1)" />

		<ns0:use ns1:href="#gear" width="14" height="56" />
		<ns0:use ns1:href="#gear" width="14" height="56" transform="translate(64 0) scale(-1 1)" />

		<ns0:use ns1:href="#letter_d" width="16" height="18" transform="translate(23.5 6)" />
		<ns0:use ns1:href="#letter_g" width="16" height="18" transform="translate(23.5 32)" />
	</ns0:g>


